<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600&family=Unbounded:wght@700&display=swap">
<style>
:root {
  --bg: #F4F3F9; --surface: #FFFFFF; --fg: #1C1930; --muted: #5D5876; --line: #DCD8EA;
  --accent: #512BD4; --accent-ink: #FFFFFF; --warn: #8A4F00;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121019; --surface: #1A1724; --fg: #ECE9F6; --muted: #A6A1BD; --line: #322C45;
    --accent: #A391FF; --accent-ink: #15111F; --warn: #EAB264;
    color-scheme: dark;
  }
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 "Golos Text", "Segoe UI", system-ui, sans-serif; }
.gate { min-height: 100%; box-sizing: border-box; display: grid; align-content: center; justify-items: center; padding: 24px 16px; }
.auto .gate { visibility: hidden; }
.box { width: 100%; max-width: 380px; display: grid; gap: 14px; }
h1 { font: 700 34px/1.05 "Unbounded", "Golos Text", system-ui, sans-serif; margin: 0; letter-spacing: -0.01em; }
h1 span { color: var(--accent); }
p { margin: 0; }
.lede { color: var(--muted); }
form { display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
label { font-weight: 600; font-size: 14px; }
input[type="password"], input[type="text"] { width: 100%; box-sizing: border-box; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.row { display: flex; align-items: center; gap: 8px; font-weight: 400; color: var(--muted); }
.row input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
button { font: inherit; font-weight: 600; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 8px; padding: 11px 16px; cursor: pointer; }
button:disabled { opacity: 0.6; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { font-size: 13px; color: var(--muted); margin-top: -6px; }
#msg { color: var(--warn); font-size: 14px; }
#msg:empty { display: none; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="gate">
  <div class="box">
    <h1>Podstawy C<span>#</span></h1>
    <p class="lede">Prywatny kurs. Wpisz hasło, żeby wejść.</p>
    <form id="form">
      <div>
        <label for="pw">Hasło</label>
        <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </div>
      <label class="row" for="show"><input id="show" type="checkbox">Pokaż hasło</label>
      <label class="row" for="rem"><input id="rem" type="checkbox" checked>Zapamiętaj na tym urządzeniu</label>
      <p class="hint">Na cudzym komputerze, np. na uczelni, odznacz.</p>
      <button id="go" type="submit">Wejdź</button>
      <p id="msg" role="alert"></p>
    </form>
    <noscript><p>Ta strona wymaga JavaScriptu.</p></noscript>
  </div>
</main>

      document.close();
    }
    // Póki parser czyta tę stronę, document.open() nie działa i treść dopisałaby się pod formularz.
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () { setTimeout(go, 0); });
    } else {
      go();
    }
  }
  function say(t) { $("msg").textContent = t; }

  if (!window.crypto || !crypto.subtle) {
    root.className = "";
    $("go").disabled = true;
    say("Ta przeglądarka nie potrafi otworzyć kursu. Zaktualizuj ją albo użyj innej.");
    return;
  }

  var saved = stored();
  if (saved) {
    decrypt(fromB64(saved)).then(render, function () { forget(); root.className = ""; $("pw").focus(); });
  } else {
    $("pw").focus();
  }

  $("show").addEventListener("change", function () { $("pw").type = this.checked ? "text" : "password"; });
  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var go = $("go"), raw;
    go.disabled = true;
    go.textContent = "Sprawdzam…";
    say("");
    derive($("pw").value.trim().toLowerCase()).then(function (bits) {
      raw = bits;
      return decrypt(bits);
    }).then(function (html) {
      remember(raw, $("rem").checked);
      render(html);
    }, function () {
      go.disabled = false;
      go.textContent = "Wejdź";
      say("Nieprawidłowe hasło. Sprawdź je i spróbuj jeszcze raz.");
      $("pw").select();
    });
  });
})();
</script>
</body>
</html>
